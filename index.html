<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POM 聚甲醛知识库</title>

<!-- 2026-08-24 性能优化：xlsx.full.min.js 881KB 改为按需懒加载（仅"导出客户档案"按钮触发），首屏不再阻塞 DOMContentLoaded -->

<style>
:root {
  --bg-primary: #f8f9fa;
  --bg-sidebar: #1e293b;
  --bg-sidebar-hover: #334155;
  --bg-sidebar-active: #0f172a;
  --bg-card: #ffffff;
  --text-primary: #1e293b;
  --text-secondary: #64748b;
  --text-sidebar: #cbd5e1;
  --text-sidebar-active: #f1f5f9;
  --accent: #0F766E;
  --accent-light: #ccfbf1;
  --border: #e2e8f0;
  --shadow: 0 1px 3px rgba(0,0,0,.08);
  --radius: 8px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg-primary); color: var(--text-primary);
  height: 100vh; height: 100dvh; display: flex; overflow: hidden;
}
.sidebar {
  width: 300px; min-width: 300px; background: var(--bg-sidebar);
  display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden;
}
.sidebar-header {
  padding: 20px 18px 14px; border-bottom: 1px solid rgba(255,255,255,.08);
  cursor: pointer; transition: background .15s;
}
.sidebar-header:hover { background: var(--bg-sidebar-hover); }
.sidebar-header h1 { color: #fff; font-size: 17px; font-weight: 700; letter-spacing: .5px; }
.sidebar-header .sub { color: var(--text-sidebar); font-size: 12px; margin-top: 4px; opacity: .7; }
.search-box { padding: 10px 14px; }
.search-box input {
  width: 100%; padding: 8px 12px; border-radius: 6px;
  border: 1px solid rgba(255,255,255,.12);
  background: rgba(255,255,255,.06); color: #fff; font-size: 13px; outline: none; transition: all .2s;
}
.search-box input::placeholder { color: rgba(255,255,255,.35); }
.search-box input:focus { background: rgba(255,255,255,.1); border-color: var(--accent); }
.file-list { flex: 1; overflow-y: auto; padding: 6px 0; }
.file-list::-webkit-scrollbar { width: 4px; }
.file-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 2px; }
.cat-group { margin-bottom: 4px; }
.cat-header {
  display: flex; align-items: center; padding: 8px 16px;
  color: var(--text-sidebar); font-size: 13px; font-weight: 600;
  cursor: pointer; user-select: none; transition: background .15s;
}
.cat-header:hover { background: var(--bg-sidebar-hover); }
.cat-header .icon { margin-right: 8px; font-size: 15px; }
.cat-header .arrow { margin-left: auto; font-size: 10px; transition: transform .2s; opacity: .5; }
.cat-header.open .arrow { transform: rotate(90deg); }
.cat-header .count {
  margin-left: 6px; background: rgba(255,255,255,.1); color: rgba(255,255,255,.5);
  font-size: 11px; padding: 1px 6px; border-radius: 10px; font-weight: 400;
}
.cat-header .lock-badge { margin-left: 4px; font-size: 11px; opacity: .6; }
.cat-files { display: none; }
.cat-files.open { display: block; }
.file-item {
  display: flex; align-items: center; padding: 7px 16px 7px 40px;
  color: var(--text-sidebar); font-size: 13px; cursor: pointer;
  transition: all .15s; border-left: 3px solid transparent;
}
.file-item:hover { background: var(--bg-sidebar-hover); color: var(--text-sidebar-active); }
.file-item.active { background: var(--bg-sidebar-active); color: #fff; border-left-color: var(--accent); }
.file-item .dot { width: 6px; height: 6px; border-radius: 50%; background: #475569; margin-right: 10px; flex-shrink: 0; }
.file-item.active .dot { background: var(--accent); }
.file-item .ext-badge {
  margin-left: auto; font-size: 10px; padding: 1px 5px; border-radius: 3px;
  background: rgba(255,255,255,.06); color: rgba(255,255,255,.35); text-transform: uppercase;
}
.file-item .ext-badge.pdf { background: rgba(239,68,68,.2); color: #f87171; }
.file-item .ext-badge.link { background: rgba(34,197,94,.15); color: #4ade80; }
.file-item .ext-badge.form { background: rgba(245,158,11,.15); color: #fbbf24; }
.sub-group { margin-left: 12px; }
.sub-header { display: flex; align-items: center; padding: 6px 16px 6px 30px; color: var(--text-sidebar); font-size: 13px; font-weight: 500; cursor: pointer; user-select: none; transition: background .15s; }
.sub-header:hover { background: var(--bg-sidebar-hover); }
.sub-header .sub-icon { margin-right: 7px; font-size: 13px; opacity: .7; }
.sub-header .arrow { margin-left: auto; font-size: 10px; transition: transform .2s; opacity: .4; }
.sub-header.open .arrow { transform: rotate(90deg); }
.sub-files { display: none; }
.sub-files.open { display: block; }
.group-wrap { margin-left: 10px; }
.group-header { display: flex; align-items: center; padding: 5px 14px 5px 30px; color: rgba(255,255,255,.45); font-size: 12px; font-weight: 500; cursor: pointer; user-select: none; transition: background .15s; }
.group-header:hover { background: var(--bg-sidebar-hover); color: var(--text-sidebar); }
.group-header .g-icon { margin-right: 6px; font-size: 11px; }
.group-header .arrow { margin-left: auto; font-size: 9px; transition: transform .2s; opacity: .4; }
.group-header.open .arrow { transform: rotate(90deg); }
.group-files { display: none; }
.group-files.open { display: block; }
.file-item.sub-file { padding-left: 56px; }
.file-item.group-file { padding-left: 68px; }
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.topbar {
  display: flex; align-items: center; padding: 12px 28px;
  background: var(--bg-card); border-bottom: 1px solid var(--border); min-height: 52px;
}
.breadcrumb { font-size: 13px; color: var(--text-secondary); }
.breadcrumb span { color: var(--text-primary); font-weight: 600; }
.topbar-actions { display: flex; gap: 8px; }
.topbar-actions button {
  padding: 5px 14px; border: 1px solid var(--border); border-radius: 6px;
  background: var(--bg-card); color: var(--text-secondary); font-size: 12px; cursor: pointer; transition: all .15s;
}
.topbar-actions button:hover { border-color: var(--accent); color: var(--accent); }
.sync-btn {
  margin-left: auto; padding: 5px 14px; border: 1px solid var(--accent); border-radius: 6px;
  background: var(--accent); color: #fff; font-size: 12px; cursor: pointer; transition: all .15s; white-space: nowrap;
}
.sync-btn:hover { opacity: .92; }
.sync-btn:disabled { opacity: .6; cursor: not-allowed; }
.content-wrap { flex: 1; overflow-y: auto; padding: 28px 36px 60px; }
.welcome { max-width: 1080px; margin: 28px auto 0; }
.hero {
  background: linear-gradient(135deg, #0F766E 0%, #0d9488 60%, #14b8a6 100%);
  border-radius: 20px; padding: 52px 40px 44px; text-align: center; color: #fff;
  position: relative; overflow: hidden; box-shadow: 0 10px 30px rgba(15,118,110,.18);
}
.hero::after {
  content: ''; position: absolute; right: -70px; top: -70px; width: 240px; height: 240px;
  background: radial-gradient(circle, rgba(255,255,255,.12), transparent 70%); border-radius: 50%;
}
.hero h1 { font-size: 34px; font-weight: 800; margin: 0 0 10px; letter-spacing: .5px; position: relative; }
.hero .hero-sub { font-size: 15px; opacity: .92; margin-bottom: 30px; position: relative; }
.hero .home-search { max-width: 640px; margin: 0 auto; position: relative; }
.hero-stats { display: flex; justify-content: center; gap: 14px; margin-top: 30px; flex-wrap: wrap; position: relative; }
.hero-stat { background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.22); border-radius: 14px; padding: 14px 26px; min-width: 116px; }
.hero-stat .hs-num { font-size: 28px; font-weight: 800; line-height: 1; }
.hero-stat .hs-label { font-size: 12px; opacity: .88; margin-top: 6px; }
/* 首页搜索 */
.search-tabs { display: flex; justify-content: center; margin-bottom: 10px; }
.search-tab {
  padding: 5px 20px; border: 1px solid var(--border); background: var(--bg-card);
  font-size: 13px; cursor: pointer; transition: all .15s; color: var(--text-secondary);
}
.search-tab:first-child { border-radius: 6px 0 0 6px; }
.search-tab:last-child { border-radius: 0 6px 6px 0; border-left: none; }
.search-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.home-search-row { position: relative; display: flex; gap: 8px; }
.home-search-row input {
  flex: 1; padding: 12px 18px 12px 42px; border-radius: 10px;
  border: 2px solid var(--border); background: var(--bg-card); font-size: 15px;
  outline: none; transition: all .2s; color: var(--text-primary);
}
.home-search-row input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(15,118,110,.12); }
.home-search-row .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 16px; color: var(--text-secondary); pointer-events: none; }
.web-search-btn {
  padding: 10px 22px; background: var(--accent); color: #fff; border: none; border-radius: 10px;
  font-size: 14px; cursor: pointer; transition: background .15s; white-space: nowrap; display: none;
}
.web-search-btn:hover { background: #0d5d56; }
.web-search-btn.show { display: block; }
.search-results { max-width: 1080px; margin: 20px auto 0; text-align: left; }
.search-results .sr-title { font-size: 13px; color: var(--text-secondary); margin-bottom: 10px; }
.sr-item {
  display: flex; align-items: center; padding: 10px 16px; background: var(--bg-card);
  border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 6px;
  cursor: pointer; transition: all .15s;
}
.sr-item:hover { border-color: var(--accent); box-shadow: 0 2px 8px rgba(15,118,110,.08); }
.sr-item .sr-icon { font-size: 16px; margin-right: 12px; }
.sr-item .sr-name { font-size: 14px; font-weight: 600; }
.sr-item .sr-cat { font-size: 12px; color: var(--text-secondary); margin-left: auto; }
.sr-item .sr-lock { font-size: 12px; margin-left: 8px; }
.sr-item .sr-body { flex: 1; min-width: 0; }
.sr-item .sr-snippet { font-size: 12px; color: var(--text-secondary); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* 分类卡片 */
.welcome .section-title { font-size: 18px; font-weight: 700; margin: 38px 0 16px; color: var(--text-primary); }
.welcome .categories-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 0; }
.welcome .cat-card {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px;
  padding: 22px 18px; cursor: pointer; transition: all .2s; position: relative;
}
.welcome .cat-card:hover { border-color: var(--accent); box-shadow: 0 6px 18px rgba(15,118,110,.10); transform: translateY(-2px); }
.welcome .cat-card.locked { border-color: #fcd34d; background: linear-gradient(180deg,#fffbeb,#fff); }
.welcome .cat-card .cat-icon { font-size: 30px; }
.welcome .cat-card .cat-name { font-size: 15px; font-weight: 700; margin-top: 10px; }
.welcome .cat-card .cat-count { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
.welcome .cat-card .card-lock { position: absolute; top: 12px; right: 12px; font-size: 11px; background: #fef3c7; color: #b45309; border-radius: 999px; padding: 3px 9px; font-weight: 600; }
.kb-footer { text-align: center; color: var(--text-secondary); font-size: 12px; margin-top: 42px; padding-top: 18px; border-top: 1px solid var(--border); }
/* 分类专属页面 */
.category-page { max-width: 860px; margin: 0 auto; }
.category-page .cp-header { display: flex; align-items: center; gap: 14px; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 2px solid var(--border); }
.category-page .cp-icon { font-size: 36px; }
.category-page .cp-title { font-size: 22px; font-weight: 700; }
.category-page .cp-count { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
.cp-sub-title { font-size: 14px; font-weight: 600; color: var(--text-secondary); margin: 18px 0 10px; padding-left: 4px; }
.cp-file-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; margin-bottom: 16px; }
.cp-file-card {
  display: flex; align-items: center; gap: 10px; padding: 12px 14px;
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
  cursor: pointer; transition: all .15s; text-decoration: none; color: inherit;
}
.cp-file-card:hover { border-color: var(--accent); box-shadow: 0 2px 8px rgba(37,99,235,.06); }
.cp-file-card .cp-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
.cp-file-card .cp-name { font-size: 13px; font-weight: 500; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cp-file-card .cp-ext { font-size: 10px; padding: 1px 5px; border-radius: 3px; background: var(--accent-light); color: var(--accent); text-transform: uppercase; font-weight: 600; }
.cp-file-card .cp-ext.pdf { background: rgba(239,68,68,.1); color: #ef4444; }
.cp-file-card .cp-ext.link { background: rgba(34,197,94,.1); color: #16a34a; }
/* 资源中心导航与视图 */
.nav-resource { display: flex; align-items: center; gap: 8px; margin: 10px 12px 4px; padding: 10px 14px; background: var(--bg-sidebar-active); color: #fff; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; transition: background .15s; }
.nav-resource:hover { background: var(--accent); }
.res-card { text-decoration: none; color: inherit; }
.res-note { font-size: 13px; color: var(--text-secondary); margin: 4px 0 18px; padding: 10px 14px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); line-height: 1.6; }
.res-size { font-size: 11px; color: var(--text-secondary); margin-left: auto; flex-shrink: 0; }
.res-loc { font-size: 11px; color: var(--text-secondary); width: 100%; margin-top: 2px; }
.cp-action-btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 10px 20px;
  background: var(--accent); color: #fff; border: none; border-radius: var(--radius);
  font-size: 14px; font-weight: 600; cursor: pointer; transition: background .15s; margin-bottom: 20px; margin-right: 10px;
}
.cp-action-btn:hover { background: #1d4ed8; }
/* 客户档案表格 */
.customer-table-wrap { overflow-x: auto; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); }
.customer-table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 640px; }
.customer-table th, .customer-table td { border: 1px solid var(--border); padding: 9px 12px; text-align: left; white-space: nowrap; }
.customer-table th { background: #f1f5f9; font-weight: 600; color: var(--accent); position: sticky; top: 0; }
.customer-table tbody tr { cursor: pointer; transition: background .12s; }
.customer-table tbody tr:hover { background: var(--accent-light); }
.customer-table .ct-idx { text-align: center; color: var(--text-secondary); font-weight: 600; }
.customer-table .ct-name { font-weight: 600; color: var(--text-primary); }
.ct-del-btn {
  padding: 4px 12px; border: 1px solid #fca5a5; border-radius: 5px;
  background: #fef2f2; color: #dc2626; font-size: 12px; cursor: pointer; transition: all .15s;
}
.ct-del-btn:hover { background: #dc2626; color: #fff; border-color: #dc2626; }
.ct-edit-btn {
  padding: 4px 12px; border: 1px solid #93c5fd; border-radius: 5px;
  background: #eff6ff; color: #2563eb; font-size: 12px; cursor: pointer; transition: all .15s; margin-right: 6px;
}
.ct-edit-btn:hover { background: #2563eb; color: #fff; border-color: #2563eb; }
/* 定位按钮 */
.loc-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.loc-btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px;
  background: #10b981; color: #fff; border: none; border-radius: 6px;
  font-size: 13px; font-weight: 600; cursor: pointer; transition: background .15s; white-space: nowrap;
}
.loc-btn:hover { background: #059669; }
.loc-status { font-size: 12px; color: var(--text-secondary); }
.loc-map-wrap { width: 100%; height: 300px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 14px; overflow: hidden; position: relative; z-index: 1; }
.loc-map-tip { font-size: 12px; color: var(--text-secondary); margin-bottom: 10px; padding: 6px 10px; background: #f0fdf4; border-radius: 6px; border: 1px solid #bbf7d0; }
.loc-btn-blue { background: #2563eb; }
.loc-btn-blue:hover { background: #1d4ed8; }
/* 客户分布区域图 */
.cust-map-wrap { width: 100%; height: 600px; border-radius: var(--radius); border: 1px solid var(--border); overflow: hidden; position: relative; z-index: 1; margin-bottom: 14px; }
.cust-map-legend { display: flex; gap: 18px; align-items: center; font-size: 13px; color: var(--text-secondary); margin-bottom: 10px; }
.cust-map-legend .lg-dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
.cust-map-nocoord { margin-top: 14px; padding: 12px 16px; background: #fef3c7; border: 1px solid #fcd34d; border-radius: 8px; font-size: 13px; color: #92400e; }
.cust-cluster-icon { background: none !important; border: none !important; }
.cust-cluster-badge { width: 36px; height: 36px; border-radius: 50%; background: #6366f1; border: 3px solid #fff; box-shadow: 0 1px 6px rgba(0,0,0,.3); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 14px; font-weight: 700; }
/* 密码弹窗 */
.pw-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none;
  align-items: center; justify-content: center; z-index: 200;
}
.pw-overlay.show { display: flex; }
.pw-dialog {
  background: var(--bg-card); border-radius: 12px; padding: 32px 28px 24px;
  width: 340px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.2);
}
.pw-dialog .pw-icon { font-size: 40px; margin-bottom: 12px; }
.pw-dialog h3 { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
.pw-dialog .pw-desc { font-size: 13px; color: var(--text-secondary); margin-bottom: 18px; }
.pw-dialog input {
  width: 100%; padding: 10px 14px; border: 2px solid var(--border); border-radius: 8px;
  font-size: 15px; text-align: center; outline: none; transition: border .2s; letter-spacing: 2px;
}
.pw-dialog input:focus { border-color: var(--accent); }
.pw-dialog input.error { border-color: #ef4444; animation: shake .3s; }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
.pw-dialog .pw-btns { display: flex; gap: 10px; margin-top: 16px; }
.pw-dialog .pw-btns button {
  flex: 1; padding: 9px 0; border-radius: 8px; font-size: 14px; cursor: pointer; transition: all .15s; border: none;
}
.pw-dialog .pw-cancel { background: #f1f5f9; color: var(--text-secondary); }
.pw-dialog .pw-cancel:hover { background: #e2e8f0; }
.pw-dialog .pw-confirm { background: var(--accent); color: #fff; }
.pw-dialog .pw-confirm:hover { background: #1d4ed8; }
.pw-dialog .pw-error { color: #ef4444; font-size: 12px; margin-top: 8px; display: none; }
.pw-dialog .pw-error.show { display: block; }
/* U1 2026-08-24：加密分类弹窗的输入框与密码可见切换 */
.cat-lock-input { width: 100%; padding: 10px 40px 10px 14px; border: 2px solid var(--border); border-radius: 8px; font-size: 15px; text-align: center; outline: none; transition: border .2s; letter-spacing: 2px; }
.cat-lock-input:focus { border-color: var(--accent); }
.cat-lock-input.error { border-color: #ef4444; animation: shake .3s; }
.cat-lock-toggle { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); border: none; background: transparent; cursor: pointer; font-size: 16px; padding: 4px; }
/* 文件内容 */
.file-meta {
  display: flex; align-items: center; gap: 16px; padding: 10px 16px;
  background: var(--accent-light); border-radius: var(--radius); margin-bottom: 20px;
  font-size: 12px; color: var(--text-secondary);
}
.file-meta .meta-tag { background: var(--accent); color: #fff; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
.md-content { max-width: 860px; line-height: 1.8; font-size: 15px; }
.md-content h1 { font-size: 24px; font-weight: 700; margin: 32px 0 16px; padding-bottom: 8px; border-bottom: 2px solid var(--border); }
.md-content h2 { font-size: 20px; font-weight: 700; margin: 28px 0 12px; color: var(--accent); }
.md-content h3 { font-size: 17px; font-weight: 600; margin: 22px 0 10px; }
.md-content h4 { font-size: 15px; font-weight: 600; margin: 18px 0 8px; }
.md-content p { margin: 10px 0; }
.md-content ul, .md-content ol { padding-left: 24px; margin: 10px 0; }
.md-content li { margin: 4px 0; }
.md-content blockquote { border-left: 4px solid var(--accent); padding: 8px 16px; margin: 12px 0; background: #f1f5f9; border-radius: 0 var(--radius) var(--radius) 0; color: var(--text-secondary); }
.md-content code { background: #f1f5f9; padding: 2px 6px; border-radius: 4px; font-size: 13px; font-family: "Cascadia Code", "Fira Code", Consolas, monospace; }

<script>
var kbData = null;
var loadedCats = {};
var customersData = null;
var currentFile = null;
var openCats = new Set();
var openSubs = new Set();
var openGroups = new Set();
var searchMode = 'local';

/* ===== XSS 防护：净化 HTML ===== */
function safeHtml(html) {
  if (typeof DOMPurify !== 'undefined') return DOMPurify.sanitize(html);
  return html;
}

/* HTML 实体转义：所有拼进 innerHTML 的动态文本（尤其是来自 customers.json 的客户字段）
   都必须经过这里，防止存储型 XSS。2026-08-01 从文件末尾移到顶部，避免依赖函数提升。 */
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

/* ===== 全文搜索索引 ===== */
var searchDocs = [];
var fuseInstance = null;

function stripHtml(html) {
  var tmp = document.createElement('div');
  tmp.innerHTML = html;
  return (tmp.textContent || tmp.innerText || '').replace(/\s+/g, ' ').trim();
}

/* U3 2026-08-24：搜索索引重建 debounce，避免短时间内多次全量重建 */
var _bsiTimer = null;
function debouncedBuildSearchIndex(appendOnly) {
  if (_bsiTimer) clearTimeout(_bsiTimer);
  var mode = !!appendOnly;
  _bsiTimer = setTimeout(function() { buildSearchIndex(mode); _bsiTimer = null; }, 200);
}

/* U3 2026-08-24：支持 appendOnly 增量模式——客户数据加载后只刷新客户条目，不重建全量索引 */
function buildSearchIndex(appendOnly) {
  if (!appendOnly) { searchDocs = []; }
  else { searchDocs = searchDocs.filter(function(d) { return !d.isCustomer; }); } // 增量：先剔旧客户条目
  if (!kbData || !kbData.categories) return;
  for (var catKey in kbData.categories) {
    var cat = kbData.categories[catKey];
    function addDoc(f, subfolder) {
      if (f.encrypted && !unlocked) return; // 未解锁时不索引敏感分类（含摘要）
      var text = f.excerpt || '';
      if (text.length > 200) text = text.slice(0, 200);
      searchDocs.push({
        name: f.name, filename: f.filename,
        category: catKey, catLabel: cat.label, catIcon: cat.icon,
        subfolder: subfolder || '', text: text
      });
    }
    if (!appendOnly) {
      (cat.files || []).forEach(function(f) { addDoc(f, ''); });
      (cat.subfolders || []).forEach(function(sub) {
        (sub.files || []).forEach(function(f) { addDoc(f, sub.name); });
        (sub.groups || []).forEach(function(g) {
          g.files.forEach(function(f) { addDoc(f, sub.name + '/' + g.name); });
        });
      });
    }
    /* 增量模式：仅把客户档案记录追加进索引（含姓名/电话/产品等可搜字段） */
    if (cat._customerRecords && cat._customerRecords.length) {

var POM_UNLOCK_KEY = 'pom_kb_unlock_v1';
var POM_PW_SALT = 'pom-kb-session-salt-v1';
function pomDeriveToken(pwd) {

  catch (e) { return ''; }

function pomSaveUnlock() {

  } catch (e) {}

function pomRestoreUnlock() {
  try {

// 同步验证一次口令：拿它去解 data-index 的 probe（POM_PROBE_OK）。返回 true/false。
async function siteLockVerify(password) {
  try {
    var res = await fetchKB('data-index.json?t=' + Date.now());

    if (!probe) { // 无探针则任何非空口令放行（兜底，正常构建必有 probe）

/* P0 性能修复：用浏览器原生 Web Crypto（PBKDF2-HMAC-SHA256 + AES-CBC）异步解密，
   不阻塞主线程；统一固定 salt 后只需派生 1 次密钥并缓存复用（与 build-static.js 一致）。
   实测：纯 JS 60万轮 PBKDF2 ≈10秒/次 → 原生 ≈0.16秒/次，且异步不冻结界面。 */
var POM_ENC_SALT_HEX = 'a1b2c3d4e5f60718293a4b5c6d7e8f90';
var pomDerivedKey = null;   // 派生密钥缓存，解锁后所有文件复用，杜绝每文件重算

function hexToBytes(hex) {
  var a = [];
  for (var i = 0; i < hex.length; i += 2) a.push(parseInt(hex.substr(i, 2), 16));
  return new Uint8Array(a);
}
function b64ToBytes(b64) {
  var bin = atob(b64);
  var bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}
async function deriveKey(password) {
  if (pomDerivedKey) return pomDerivedKey;
  var baseKey = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  pomDerivedKey = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: hexToBytes(POM_ENC_SALT_HEX), iterations: 600000, hash: 'SHA-256' },
    baseKey,
    { name: 'AES-CBC', length: 256 },
    false,
    ['decrypt']
  );
  return pomDerivedKey;
}
async function decryptText(payload, password) {
  if (typeof payload !== 'string' || payload.indexOf('ENC:') !== 0) return payload;
  var p = payload.split(':');
  var iv = hexToBytes(p[2]);
  var ct = b64ToBytes(p[3]);
  var key = await deriveKey(password);
  var plainBuf = await crypto.subtle.decrypt({ name: 'AES-CBC', iv: iv }, key, ct);
  return new TextDecoder().decode(plainBuf);
}

function isProtected(catKey) {
  for (var i = 0; i < PROTECTED_CATS.length; i++) {
    if (catKey.indexOf(PROTECTED_CATS[i]) === 0) return true;
  }
  return false;
}

  if (unlocked && accessPassword) { callback(); return; }   // S1：内存中仍有口令，直接放行
  // 本地免密：仅当本地 server 注入了 __KB_LOCAL_MASTER__（localhost 访问时）才走此分支；
  // 线上公网域名不注入该变量，自动跳过，仍弹窗输口令。主密钥不落公开前端文件。
  if (window.__KB_LOCAL_MASTER__) {

    if (!lprobe) { unlocked = true; accessPassword = window.__KB_LOCAL_MASTER__; pomSaveUnlock(); callback(); return; }
    try {

      if (lt === 'POM_PROBE_OK') { unlocked = true; accessPassword = window.__KB_LOCAL_MASTER__; pomSaveUnlock(); callback(); return; }

/* ===== URL 哈希路由 ===== */
function navigateFromHash() {
  var h = location.hash;
  if (!h || h === '#' || h === '#/') return false;
  var parts = h.replace(/^#\/?/, '').split('/').map(function(s) { return decodeURIComponent(s); });
  if (parts.length < 2) return false;
  var category = parts[0];
  var filename, subfolder = '';
  if (parts.length === 2) {
    filename = parts[1];
  } else {
    subfolder = parts.slice(1, -1).join('/');
    filename = parts[parts.length - 1];
  }
  if (!kbData || !kbData.categories || !kbData.categories[category]) return false;
  var file = findFileInCat(kbData.categories[category], filename, subfolder);
  if (!file) return false;
  openFile(category, filename, subfolder);
  return true;
}
window.addEventListener('hashchange', function() {
  if (location.hash === '#/resources') { showResources(); return; }
  if (!navigateFromHash()) {
    /* 哈希被清空或无效时回到首页 */
    if (!location.hash || location.hash === '#' || location.hash === '#/') showWelcome();
  }
});

async function fetchKB(name, timeout) {
  timeout = timeout || 8000;
  // 线下模式（localhost/127.0.0.1/file）：只读本地，不回退 jsDelivr 线上源
  var offline = shouldShowSyncButton();
  var sources = offline ? [name] : [name, KB_CDN + name];
  var lastErr;
  for (var i = 0; i < sources.length; i++) {
    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, timeout);
    try {
      var res = await fetch(sources[i], { signal: ctrl.signal });
      clearTimeout(timer);
      if (res.ok) return res;
      console.warn('[fetchKB] 非200:', sources[i], res.status);
    } catch (e) {
      clearTimeout(timer);
      lastErr = e;
      console.warn('[fetchKB] 失败:', sources[i], (e && e.message) || e);
    }
  }
  throw new Error((offline ? '本地文件缺失或读取失败: ' : '所有数据源加载失败: ') + name + (lastErr ? ' (' + (lastErr.message || lastErr) + ')' : '') + (offline ? '（请确认已构建 dist，或重跑 build-static.js）' : ''));
}

async function ensureCategory(catKey) {
  if (loadedCats[catKey] || !kbData || !kbData.categories || !kbData.categories[catKey]) return;
  try {
    var res = await fetchKB('cat-' + encodeURIComponent(catKey) + '.json');
    if (!res.ok) {
      /* 2026-08-01 整改：原先静默 return，分类打不开时页面一片空白、用户无从判断 */
      console.warn('分类内容加载失败 HTTP ' + res.status + ' : ' + catKey);
      showToast('「' + catKey.replace(/^\d+-/, '') + '」内容加载失败，请检查网络后刷新');
      return;
    }
    var d = await res.json();
    var cat = kbData.categories[catKey];
    cat.files = d.files;
    cat.subfolders = d.subfolders;
    loadedCats[catKey] = true;
  } catch (e) {
    console.warn('分类内容加载异常：' + catKey, e);
    showToast('「' + catKey.replace(/^\d+-/, '') + '」内容加载失败，请检查网络后刷新');
  }
}

/* 判断当前是否为线下环境（本地服务 / 本地文件），只有线下才显示「同步线上内容」按钮 */
function shouldShowSyncButton() {
  var h = location.hostname.toLowerCase();
  // 同时作为「线下模式」判定：localhost/127.0.0.1/::1 本地服务 或 file:// 直接打开 = 线下（不读线上知识库内容）
  if (h === 'localhost' || h === '127.0.0.1' || h === '::1' || location.protocol === 'file:') return true;
  return false;
}

async function init() {
  try {
    // ===== 全站门禁（方案A）：未解锁先弹遮罩，不 fetch / 不 render 任何内容 =====
    siteLockRestore();
    // 本地免密：注入了 __KB_LOCAL_MASTER__ 时自动解锁（教授本地无感）
    if (!siteUnlocked && window.__KB_LOCAL_MASTER__) {
      var okLocal = await siteLockVerify(window.__KB_LOCAL_MASTER__);
      if (okLocal) { siteUnlocked = true; accessPassword = window.__KB_LOCAL_MASTER__; siteLockSave(); }
    }
    if (!siteUnlocked) {
      siteLockShow();
      return; // 阻断后续数据加载与渲染，满足“打开就要密码、看不到内容”
    }
    siteLockHide();

    var syncBtn = document.getElementById('syncOnlineBtn');
    if (syncBtn && shouldShowSyncButton()) syncBtn.style.display = '';
    var res = await fetchKB('data-index.json');
    kbData = await res.json();
    loadedCats = {};
    debouncedBuildSearchIndex();
    renderSidebar();
    if (location.hash === '#/resources') { showResources(); }
    else if (!navigateFromHash()) showWelcome();
    /* 客户档案异步加载（jsDelivr 国内偶发慢），不阻塞首屏；返回后增量追加客户条目到索引 */
    loadCustomers().then(function() {
      mergeCustomers();
      debouncedBuildSearchIndex(true);
      renderSidebar();
    }).catch(function() {});
  } catch (e) {
    document.getElementById('contentWrap').innerHTML = '<div class="pdf-notice"><div class="icon">⚠️</div><p>加载失败: ' + e.message + '</p></div>';
  }
}

async function refreshData() {
  try {
    var res = await fetchKB('data-index.json?t=' + Date.now());
    kbData = await res.json();
    loadedCats = {};
    await loadCustomers();
    mergeCustomers();
    debouncedBuildSearchIndex();
    renderSidebar();
    showToast('数据已刷新 (' + new Date(kbData.buildTime).toLocaleString('zh-CN') + ')');
  } catch (e) { showToast('刷新失败'); }
}

/* ===== customers.json 加载与合并 ===== */
async function loadCustomers() {
  // 线下模式（localhost/127.0.0.1/file）：只读本地 customers.json 快照，不主动读线上 FC/CDN
  if (shouldShowSyncButton()) {
    try {
      var r0 = await fetch('customers.json?t=' + Date.now());
      if (r0.ok) { customersData = await r0.json() || { records: [] }; return; }
    } catch (e0) { console.warn('离线模式读取本地 customers.json 失败', e0); }
    customersData = { records: [] };
    return;
  }
  // 优先走阿里云函数计算：与提交同源，无 CDN 缓存延迟，新增客户即时可见
  try {
    var res = await fcReq(WORKER_URL + '/customers');
    if (res.ok) {
      customersData = await res.json() || { records: [] };
      return;
    }
  } catch (e) {
    console.warn('阿里云FC读取客户档案失败，回退 jsDelivr', e);
  }
  // 兜底：jsDelivr CDN 直连 GitHub（国内可达，但存在缓存延迟，可能读不到刚新增的客户）
  var CDN = 'https://cdn.jsdelivr.net/gh/yikezhong1/pom-knowledge-base/customers.json?_=' + Date.now();
  try {
    var res2 = await fetch(CDN);
    if (res2.ok) {
      customersData = await res2.json() || { records: [] };
      return;
    }
  } catch (e2) {
    console.warn('jsDelivr 读取客户档案失败', e2);
  }
  // 离线兜底：本地 customers.json 快照（桌面端 CSP 拦了 FC/CDN 时使用；浏览器部署/本地服务下也能走）
  try {
    var res3 = await fetch('customers.json?t=' + Date.now());
    if (res3.ok) {
      customersData = await res3.json() || { records: [] };
      return;
    }
  } catch (e3) {
    console.warn('本地 customers.json 读取失败', e3);
  }
  customersData = { records: [] };
}

function mergeCustomers() {
  if (!kbData || !kbData.categories) return;
  var catKey = '04-客户档案';
  var cat = kbData.categories[catKey];
  if (!cat) return;
  /* 移除旧版子文件夹形式的在线记录 */
  if (cat.subfolders) {
    cat.subfolders = cat.subfolders.filter(function(sub) { return sub.name !== '现有客户档案'; });
  }
  /* 保存客户记录用于横向表格显示（过滤已删除记录，最新的在前） */
  var all = (customersData && customersData.records) ? customersData.records : [];
  var records = all.filter(function(r) { return r.deleted !== true; }).slice().reverse();
  cat._customerRecords = records;
}

/* 2026-08-10 新增：顶栏「🔄 同步线上内容」按钮调用。
   浏览器站（启动知识库.bat 本地服务 / GitHub Pages）：直接 fetch 阿里云FC+jsDelivr 拉取最新客户档案，
   若本地服务在跑则 POST /api/sync-write 写回 dist/customers.json，否则仅刷新显示。
   （原 ① 桌面端 Electron IPC 路径已随 Electron 桌面端 2026-08-31 删除而移除。） */
async function syncOnlineCustomers() {
  var btn = document.getElementById('syncOnlineBtn');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ 同步中...'; }
  showToast('正在从线上同步客户档案...');
  try {
    var res = null;

    // 桌面端 Electron IPC 路径已随 Electron 桌面端（2026-08-31 删除）移除；以下走浏览器站路径 B

    // 路径 B：浏览器站（直接 fetch 线上 + 可选 POST /api/sync-write）
    if (!res) {
      var data = null;
      try {
        var r1 = await fcReq(WORKER_URL + '/customers?_=' + Date.now(), { cache: 'no-store' });
        if (r1.ok) data = await r1.json();
      } catch (e) { console.warn('同步：阿里云FC读取失败，尝试 jsDelivr', e); }
      if (!data) {
        var CDN = 'https://cdn.jsdelivr.net/gh/yikezhong1/pom-knowledge-base/customers.json?_=' + Date.now();
        try {
          var r2 = await fetch(CDN, { cache: 'no-store' });
          if (r2.ok) data = await r2.json();
        } catch (e2) { console.warn('同步：jsDelivr读取失败', e2); }
      }
      if (!data || !data.records) throw new Error('线上客户数据为空或读取失败');

      customersData = data;
      mergeCustomers(); buildSearchIndex(); renderSidebar();
      var onTable = !!document.getElementById('custTableBody');
      var cat05 = (kbData && kbData.categories) ? kbData.categories['04-客户档案'] : null;
      if (cat05 && cat05._customerRecords && onTable && (!isProtected('04-客户档案') || unlocked)) showCustomerTable();

      var savedLocal = false;
      try {
        var put = await fetch('/api/sync-write?file=customers.json', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        if (put.ok) savedLocal = true;
      } catch (e3) { /* file:// 打开或远端部署，忽略 */ }

      res = { ok: true, count: data.records.length, savedToLocal: savedLocal };
    }

    if (!res || !res.ok) throw new Error((res && res.error) || '同步失败');

    // IPC 写本地成功后，重新走本地兜底加载并刷新视图
    if (res.savedToLocal) {
      try {
        await loadCustomers();
        mergeCustomers(); buildSearchIndex(); renderSidebar();
        var onTable2 = !!document.getElementById('custTableBody');
        var cat05b = (kbData && kbData.categories) ? kbData.categories['04-客户档案'] : null;
        if (cat05b && cat05b._customerRecords && onTable2 && (!isProtected('04-客户档案') || unlocked)) showCustomerTable();
      } catch (e4) { console.warn('同步后刷新视图失败', e4); }
    }

    var msg = '✅ 已从线上同步 ' + res.count + ' 条客户档案';
    msg += res.savedToLocal ? '，已写入本地文件' : '，线上数据已刷新';
    showToast(msg);
  } catch (e) {
    showToast('❌ 同步失败：' + (e && e.message ? e.message : e));
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '🔄 同步线上内容'; }
  }
}

function generateCustomerMd(rec) {
  var md = '# ' + (rec.customerName || '客户档案') + '\n\n';
  md += '> 录入时间：' + (rec.entryTime ? new Date(rec.entryTime).toLocaleString('zh-CN') : '未知') + '\n\n';
  for (var s = 0; s < FORM_SECTIONS.length; s++) {
    var section = FORM_SECTIONS[s];
    var hasContent = false;
    var sectionMd = '';
    for (var f = 0; f < section.fields.length; f++) {
      var field = section.fields[f];
      var val = rec[field.key];
      if (val && val.trim()) {
        hasContent = true;
        sectionMd += '| ' + field.label + ' | ' + val.trim() + ' |\n';
      }
    }
    if (hasContent) {
      md += '## ' + section.icon + ' ' + section.title + '\n\n';
      md += '| 字段 | 内容 |\n|------|------|\n';
      md += sectionMd + '\n';
    }
  }
  return md;
}

/* ===== 强刷（点左上角 POM 知识库）：注销所有 SW + 绕过 HTTP 缓存重载当前页 ===== */
function hardReload() {
  function doReload() {
    /* 去掉上次可能残留的 _hr 时间戳，再追加新时间戳，保证每次 URL 不同、绕过 HTTP/CDN 缓存 */
    var href = window.location.href.replace(/[?&]_hr=\d+/, '');
    var sep = href.indexOf('?') >= 0 ? '&' : '?';
    window.location.replace(href + sep + '_hr=' + Date.now());
  }
  if ('serviceWorker' in navigator) {
    /* 先注销所有已注册 SW（清掉旧缓存），再强制重载，等价于 Ctrl+F5 + 手动 Unregister */
    navigator.serviceWorker.getRegistrations().then(function(regs) {
      return Promise.all(regs.map(function(r) { return r.unregister(); }));
    }).catch(function() {}).then(doReload);
  } else { doReload(); }
}

async function goHome() {
  openCats.clear();
  openSubs.clear();
  openGroups.clear();
  document.getElementById('searchInput').value = '';
  if (location.hash) location.hash = '';
  /* 2026-08-30 修复：refreshData() 是异步拉数据的，原来不 await 就 showWelcome()，
     此时 kbData 还是 null，showWelcome() 首行 if(!kbData) return —— 于是点 logo 后
     侧边栏渲染出来了、主内容区却仍卡在「加载中」。先等数据回来再渲染首页。 */
  try { await refreshData(); } catch (e) { console.warn('首页数据刷新失败', e); }
  showWelcome();
}

/* ===== 移动端抽屉 ===== */
function toggleSidebar() {
  var sb = document.querySelector('.sidebar');
  var mask = document.getElementById('sidebarMask');
  if (!sb || !mask) return;
  if (sb.classList.contains('open')) {
    sb.classList.remove('open');
    mask.classList.remove('show');
  } else {
    sb.classList.add('open');
    mask.classList.add('show');
  }
}
function closeSidebar() {
  var sb = document.querySelector('.sidebar');
  var mask = document.getElementById('sidebarMask');
  if (sb) sb.classList.remove('open');
  if (mask) mask.classList.remove('show');
}

function saveOpenState() {
  document.querySelectorAll('.cat-header.open').forEach(function(h) {
    var label = h.querySelector('span:nth-child(2)');
    if (label) openCats.add(label.textContent);
  });
  document.querySelectorAll('.sub-header.open').forEach(function(h) {
    var label = h.querySelector('span:nth-child(2)');
    if (label) openSubs.add(label.textContent);
  });
  document.querySelectorAll('.group-header.open').forEach(function(h) {
    var label = h.querySelector('span:nth-child(2)');
    if (label) openGroups.add(label.textContent);
  });
}

/* ===== 文件打开 ===== */
function findFileInCat(cat, filename, subfolder) {
  if (!subfolder) {
    var f = (cat.files || []).find(function(f) { return f.filename === filename; });
    if (f) return f;
  }
  for (var i = 0; i < (cat.subfolders || []).length; i++) {
    var sub = cat.subfolders[i];
    if (subfolder === sub.name) {
      var sf = (sub.files || []).find(function(f) { return f.filename === filename; });
      if (sf) return sf;
    }
    for (var j = 0; j < (sub.groups || []).length; j++) {
      if (subfolder === sub.name + '/' + sub.groups[j].name) {
        var gf = sub.groups[j].files.find(function(f) { return f.filename === filename; });
        if (gf) return gf;
      }
    }
  }
  for (var k = 0; k < (cat.subfolders || []).length; k++) {
    var s2 = cat.subfolders[k];
    for (var a = 0; a < (s2.files || []).length; a++) { if (s2.files[a].filename === filename) return s2.files[a]; }
    for (var b = 0; b < (s2.groups || []).length; b++) {
      for (var c = 0; c < s2.groups[b].files.length; c++) { if (s2.groups[b].files[c].filename === filename) return s2.groups[b].files[c]; }
    }
  }
  return null;
}

async function openFile(category, filename, subfolder) {
  /* 2026-08-23 修复(Bug A 配套)：subfolder 可能来自 onclick(已 encodeURIComponent) 或 hash 路由(已解码)，
     统一还原为原始值，保证 currentFile.subfolder 与数据一致、findFileInCat 精确匹配生效。 */
  subfolder = subfolder ? decodeURIComponent(subfolder) : '';
  if (isProtected(category) && !unlocked) {
    requireUnlock(category, function() { openFile(category, filename, subfolder); });
    return;
  }
  await ensureCategory(category);
  destroyMap();
  currentFile = { category: category, filename: filename, subfolder: subfolder || '' };
  /* 更新 URL 哈希，支持分享/收藏/前进后退 */
  /* 2026-08-23 修复(Bug A)：侧栏 onclick 已对子目录做过一次 encodeURIComponent，
     openFile 这里若再 encode 一次会变成双重编码，使 location.hash 每次重写都再编码，
     触发无限 hashchange 循环（子目录文件点开"跳回/没了"）。统一：先 decode 还原再单次 encode，
     保证从 onclick(已编码) 或 navigateFromHash(已解码) 进入都得到稳定且一致的 hash。 */
  /* subfolder 已在函数入口解码为原始值，这里直接复用，避免冗余 decodeURIComponent 再引入编码问题 */
  var subfolderForHash = subfolder || '';
  var hashPath = '#/' + encodeURIComponent(category) + '/' + (subfolderForHash ? encodeURIComponent(subfolderForHash) + '/' : '') + encodeURIComponent(filename);
  if (location.hash !== hashPath) location.hash = hashPath;
  renderSidebar(document.getElementById('searchInput').value.trim());
  var content = document.getElementById('contentWrap');
  var catMeta = kbData.categories[category];
  var file = findFileInCat(catMeta, filename, subfolder);
  if (!file) return;
  if (file.encrypted && !unlocked) {
    requireUnlock(category, function() { openFile(category, filename, subfolder); });
    return;
  }
  var breadPath = catMeta.icon + ' ' + catMeta.label;
  if (subfolder) breadPath += ' / ' + subfolder.replace(/\//g, ' / ');
  breadPath += ' / <span>' + file.name + '</span>';
  document.getElementById('breadcrumb').innerHTML = breadPath;
  var actions = document.getElementById('topbarActions');
  if (file.ext === 'mp4' || file.ext === 'webm' || file.ext === 'ogg') {
    var vidUrl = './' + encodeURIComponent(category) + '/' + (subfolder ? encodeURIComponent(subfolder) + '/' : '') + encodeURIComponent(filename);
    actions.innerHTML = '<a class="pdf-dl-btn" href="' + vidUrl + '" target="_blank" rel="noopener" style="display:inline-block;padding:6px 14px;border-radius:8px;background:var(--accent,#2563eb);color:#fff;text-decoration:none;font-size:13px;font-weight:600;">新窗口打开视频</a>';
    content.innerHTML = '<div style="padding:10px 0"><video controls preload="metadata" src="' + vidUrl + '" style="max-width:100%;border-radius:12px;background:#0b1220;display:block;margin:0 auto"></video></div>';
    return;
  }
  if (file.ext === 'pdf') {
    var pdfUrl = './' + encodeURIComponent(category) + '/' + (subfolder ? encodeURIComponent(subfolder) + '/' : '') + encodeURIComponent(filename);
    actions.innerHTML = '<a class="pdf-dl-btn" href="' + pdfUrl + '" target="_blank" rel="noopener" style="display:inline-block;padding:6px 14px;border-radius:8px;background:var(--accent,#2563eb);color:#fff;text-decoration:none;font-size:13px;font-weight:600;">打开 / 下载 PDF</a>';
    content.innerHTML = '<div class="pdf-notice"><div class="icon">📄</div><p>这是 PDF 文件：' + file.name + '</p><p style="margin-top:8px;font-size:13px;color:#94a3b8">点击右上角「打开 / 下载 PDF」查看完整内容（含效果图、示意图）。</p></div>';
    return;
  }
  actions.innerHTML = '<button onclick="copyContent()">复制内容</button>';
  var modDate = new Date(file.modified).toLocaleString('zh-CN');
  var sizeKB = (file.size / 1024).toFixed(1);
  var subLabel = subfolder ? ' / ' + subfolder : '';
  var htmlToRender = file.html;
  if (file.encrypted) {
    try { htmlToRender = await decryptText(file.html, accessPassword); }
    catch (e) { htmlToRender = '<p style="color:#ef4444">内容解密失败，请刷新页面重试。</p>'; }
  }
  content.innerHTML = '<div class="file-meta"><span class="meta-tag">' + catMeta.label + subLabel + '</span><span>' + filename + '</span><span>' + sizeKB + ' KB</span><span>更新于 ' + modDate + '</span></div>' + safeHtml(htmlToRender.indexOf('md-content') >= 0 ? htmlToRender : '<div class="md-content">' + htmlToRender + '</div>');
  content.scrollTop = 0;
  if (window.innerWidth <= 768) closeSidebar();
}

/* ===== 离线地址解析（自动拆分省/市/区县/乡镇，无需联网/定位） ===== */
var PROVINCE_MAP = {
  '北京市':'北京','天津市':'天津','上海市':'上海','重庆市':'重庆',
  '河北省':'河北','山西省':'山西','辽宁省':'辽宁','吉林省':'吉林','黑龙江省':'黑龙江',
  '江苏省':'江苏','浙江省':'浙江','安徽省':'安徽','福建省':'福建','江西省':'江西',
  '山东省':'山东','河南省':'河南','湖北省':'湖北','湖南省':'湖南','广东省':'广东',
  '海南省':'海南','四川省':'四川','贵州省':'贵州','云南省':'云南','陕西省':'陕西',
  '甘肃省':'甘肃','青海省':'青海','台湾省':'台湾',
  '内蒙古自治区':'内蒙古','广西壮族自治区':'广西','西藏自治区':'西藏',
  '宁夏回族自治区':'宁夏','新疆维吾尔自治区':'新疆',
  '香港特别行政区':'香港','澳门特别行政区':'澳门'
};
var PROVINCE_FULL = {
  '北京':'北京市','天津':'天津市','上海':'上海市','重庆':'重庆市',
  '河北':'河北省','山西':'山西省','辽宁':'辽宁省','吉林':'吉林省','黑龙江':'黑龙江省',
  '江苏':'江苏省','浙江':'浙江省','安徽':'安徽省','福建':'福建省','江西':'江西省',
  '山东':'山东省','河南':'河南省','湖北':'湖北省','湖南':'湖南省','广东':'广东省',
  '海南':'海南省','四川':'四川省','贵州':'贵州省','云南':'云南省','陕西':'陕西省',
  '甘肃':'甘肃省','青海':'青海省','台湾':'台湾省',
  '内蒙古':'内蒙古自治区','广西':'广西壮族自治区','西藏':'西藏自治区',
  '宁夏':'宁夏回族自治区','新疆':'新疆维吾尔自治区',
  '香港':'香港特别行政区','澳门':'澳门特别行政区'
};
var MUNICIPAL = ['北京','天津','上海','重庆'];

function parseAddress() {
  var addrEl = document.getElementById('field_address');
  var regionEl = document.getElementById('field_marketRegion');
  if (!addrEl) return;
  var raw = (addrEl.value || '').trim();
  if (!raw) { showToast('请先在「省/市/区县/乡镇」框里粘贴完整地址'); return; }

  var province = '', city = '', district = '', town = '';
  /* 1) 识别省/直辖市/自治区/特别行政区：优先全称，再兜底简称 */
  for (var full in PROVINCE_MAP) {
    if (PROVINCE_MAP.hasOwnProperty(full) && raw.indexOf(full) >= 0) { province = PROVINCE_MAP[full]; break; }
  }
  if (!province) {
    for (var full2 in PROVINCE_MAP) {
      if (!PROVINCE_MAP.hasOwnProperty(full2)) continue;
      var shortName = PROVINCE_MAP[full2];
      if (raw.indexOf(shortName) >= 0) { province = shortName; break; }
    }
  }
  /* 2) 识别市：省之后找第一个「XX市」 */
  var rest = province ? raw.slice(raw.indexOf(province) + province.length) : raw;
  var mCity = rest.match(/(.{2,10}?市)/);
  if (mCity) { city = mCity[1].replace(/市$/, ''); }
  /* 直辖市：市与省同名 */
  if (MUNICIPAL.indexOf(province) >= 0) city = province;
  /* 3) 识别区/县 */
  var mDist = rest.match(/(.{2,10}?(?:区|县))/);
  if (mDist) district = mDist[1];
  /* 4) 识别镇/乡/街道 */
  var mTown = rest.match(/(.{2,10}?(?:镇|乡|街道|街道办事处))/);
  if (mTown) town = mTown[1];

  /* 市场区域 = 省/市 */
  var region = province ? (city && city !== province ? province + '/' + city : province) : city;
  if (regionEl) regionEl.value = region || '';

  /* 若地址缺省字头，补全省份全称便于阅读 */
  if (province && raw.indexOf(province) < 0) {
    addrEl.value = (PROVINCE_FULL[province] || province) + raw;
  }

  var statusEl = document.getElementById('locStatus');
  if (statusEl) statusEl.textContent = '✅ 地址已离线解析，可手动修改';
  var tail = (district ? ' · ' + district : '') + (town ? ' · ' + town : '');
  showToast('✅ 已自动解析：' + (region || '未识别到省市') + tail);
}

/* ===== 手机定位 ===== */
function getLocation() {
  var statusEl = document.getElementById('locStatus');
  var coordEl = document.getElementById('field_coordinates');
  if (!navigator.geolocation) {
    if (statusEl) statusEl.textContent = '您的浏览器不支持定位功能，请手动填写';
    return;
  }
  if (statusEl) statusEl.textContent = '正在获取位置，请允许定位权限...';
  navigator.geolocation.getCurrentPosition(function(pos) {
    var lat = pos.coords.latitude.toFixed(6);
    var lng = pos.coords.longitude.toFixed(6);
    if (coordEl) coordEl.value = lat + ',' + lng;
    if (statusEl) statusEl.textContent = '✅ 已获取坐标，正在解析地址...';
    /* 联动地图：移动中心和标记 */
    if (locationMap) { locationMap.setView([parseFloat(lat), parseFloat(lng)], 15); }
    if (locationMarker) { locationMarker.setLatLng([parseFloat(lat), parseFloat(lng)]); }
    /* 逆地理编码，自动填写省市区县 */
    reverseGeocode(lat, lng).then(function(info) {
      var regionEl = document.getElementById('field_marketRegion');
      var addrEl = document.getElementById('field_address');
      if (regionEl && info.marketRegion) regionEl.value = info.marketRegion;
      if (addrEl && info.fullAddress) addrEl.value = info.fullAddress;
      if (statusEl) statusEl.textContent = '✅ 已自动填写位置信息，可手动修改';
      showToast('位置信息已自动填写');
    }).catch(function(err) {
      var tip = (err && err.message && err.message.indexOf('未配置') >= 0) ? '（请先到高德申请 Web 服务 key 并填入源码 AMAP_WEB_KEY）' : '（可手动填写或使用「自动解析地址」）';
      if (statusEl) statusEl.textContent = '✅ 已获取坐标，地址解析未成功' + tip;
    });
  }, function(err) {
    var msg = '定位失败';
    if (err.code === 1) msg = '定位失败：您拒绝了位置权限，请在浏览器设置中允许后重试';
    else if (err.code === 2) msg = '定位失败：无法获取位置信息，请检查GPS是否开启';
    else if (err.code === 3) msg = '定位失败：获取位置超时，请重试';
    if (statusEl) statusEl.textContent = msg;
    showToast(msg);
  }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 });
}

/* ===== 逆地理编码（走 FC /api/geocode 代理，高德 key 仅存 FC 后端，不下发前端）=====
   整改（2026-08-31，A10）：原前端直连 restapi.amap.com 带明文 Web 服务 key（随公网发布，可被盗刷）
   → 改为请求自建 FC 代理，FC 用环境变量 AMAP_WEB_KEY 调高德，前端零 key。
   GET 需 READ_TOKEN 鉴权（前端注入值即 READ_TOKEN）。FC 未上线时自动降级为手填。 */
function reverseGeocode(lat, lng) {
  return new Promise(function(resolve, reject) {
    var url = WORKER_URL + '/geocode?lat=' + encodeURIComponent(lat) + '&lng=' + encodeURIComponent(lng);
    fcReq(url, {})  /* 自动带 READ_TOKEN；FC 未上线时 reject，由调用方降级处理 */
      .then(function(r) {
        if (!r.ok) throw new Error('地址解析失败');
        return r.json();
      })
      .then(function(data) {
        if (data.status !== "1") { reject(new Error(data.info || "高德返回错误")); return; }
        var comp = (data.regeocode && data.regeocode.addressComponent) || {};
        var province = comp.province || "";
        var city = comp.city || "";
        if (city === province) city = "";
        var district = comp.district || "";
        var township = comp.township || "";
        var shortProv = province.replace(/省|市|壮族自治区|回族自治区|维吾尔自治区|自治区|特别行政区/g, "");
        var shortCity = city.replace(/市|自治州|地区|盟/g, "");
        var marketRegion = shortProv ? (shortCity ? shortProv + "/" + shortCity : shortProv) : shortCity;
        var fullAddress = (data.regeocode && data.regeocode.formatted_address) || (province + city + district + township);
        resolve({ marketRegion: marketRegion, fullAddress: fullAddress, province: shortProv, city: shortCity, district: district, township: township });
      })
      .catch(function(e) { reject(e); });
  });
}

function initLocationMap(lat, lng, zoom) {
  destroyMap();
  loadLeaflet(function() {
    var mapEl = document.getElementById('locationMap');
    if (!mapEl) return;
    mapEl.innerHTML = '';
    locationMap = L.map('locationMap', { center: [lat, lng], zoom: zoom || 13 });
    L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
      subdomains: '1234',
      maxZoom: 18,
      errorTileUrl: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==',
      attribution: '&copy; 高德地图'
    }).addTo(locationMap);
    locationMarker = L.marker([lat, lng], { draggable: true }).addTo(locationMap);
    locationMarker.on('dragend', function() {
      var pos = locationMarker.getLatLng();
      onMapLocationSelect(pos.lat, pos.lng);
    });
    locationMap.on('click', function(e) {
      locationMarker.setLatLng(e.latlng);
      onMapLocationSelect(e.latlng.lat, e.latlng.lng);
    });
  });
}

function onMapLocationSelect(lat, lng) {
  var coordEl = document.getElementById('field_coordinates');
  if (coordEl) coordEl.value = lat.toFixed(6) + ',' + lng.toFixed(6);
  var statusEl = document.getElementById('locStatus');
  if (statusEl) statusEl.textContent = '✅ 已选择坐标，正在解析地址...';
  reverseGeocode(lat.toFixed(6), lng.toFixed(6)).then(function(info) {
    var regionEl = document.getElementById('field_marketRegion');
    var addrEl = document.getElementById('field_address');
    if (regionEl && info.marketRegion) regionEl.value = info.marketRegion;
    if (addrEl && info.fullAddress) addrEl.value = info.fullAddress;
    if (statusEl) statusEl.textContent = '✅ 已自动填写位置信息，可手动修改';
    showToast('位置信息已自动填写');
  }).catch(function(err) {
    var tip = (err && err.message && err.message.indexOf('未配置') >= 0) ? '（请先到高德申请 Web 服务 key 并填入源码 AMAP_WEB_KEY）' : '（可手动填写或使用「自动解析地址」）';
    if (statusEl) statusEl.textContent = '✅ 已选择坐标，地址解析未成功' + tip;
  });
}

function goToCurrentLocation() {
  var statusEl = document.getElementById('locStatus');
  if (!navigator.geolocation) {
    if (statusEl) statusEl.textContent = '您的浏览器不支持定位功能';
    return;
  }
  if (statusEl) statusEl.textContent = '正在获取当前位置...';
  navigator.geolocation.getCurrentPosition(function(pos) {
    var lat = pos.coords.latitude;
    var lng = pos.coords.longitude;
    if (locationMap) {
      locationMap.setView([lat, lng], 15);
      if (locationMarker) locationMarker.setLatLng([lat, lng]);
    }
    onMapLocationSelect(lat, lng);
    showToast('已回到当前位置');
  }, function(err) {
    var msg = '定位失败';
    if (err.code === 1) msg = '定位失败：请允许位置权限后重试';
    else if (err.code === 2) msg = '定位失败：无法获取位置信息';
    else if (err.code === 3) msg = '定位失败：获取位置超时';
    if (statusEl) statusEl.textContent = msg;
    showToast(msg);
  }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 });
}

async function submitCustomerForm() {
  /* 验证必填项 */
  var nameEl = document.getElementById('field_customerName');
  if (!nameEl || !nameEl.value.trim()) {
    if (nameEl) nameEl.classList.add('error');
    showToast('请填写「拜访客户名称」');
    if (nameEl) nameEl.focus();
    return;
  }
  nameEl.classList.remove('error');
  /* 验证电话格式（允许手机/座机/空） */
  var phoneEl = document.getElementById('field_phone');
  if (phoneEl && phoneEl.value.trim()) {
    var phoneVal = phoneEl.value.trim();
    if (!/^[\d\-\+\s()]{5,20}$/.test(phoneVal)) {
      phoneEl.classList.add('error');
      showToast('联系电话格式不正确（5-20位数字，可含-+空格）');
      phoneEl.focus();
      return;
    }
    phoneEl.classList.remove('error');
  }
  /* 验证坐标格式（允许空或 lat,lng） */
  var coordEl = document.getElementById('field_coordinates');
  if (coordEl && coordEl.value.trim()) {
    var coordVal = coordEl.value.trim();
    if (!/^-?\d+(\.\d+)?\s*,\s*-?\d+(\.\d+)?$/.test(coordVal)) {
      coordEl.classList.add('error');
      showToast('经纬度格式不正确，应为：纬度,经度（如 22.54,113.75）');
      coordEl.focus();
      return;
    }
    coordEl.classList.remove('error');
  }
  /* 收集数据 */
  var record = {};
  for (var s = 0; s < FORM_SECTIONS.length; s++) {
    var fields = FORM_SECTIONS[s].fields;
    for (var f = 0; f < fields.length; f++) {
      var el = document.getElementById('field_' + fields[f].key);
      if (el) record[fields[f].key] = el.value;
    }
  }
  record.entryTime = new Date().toISOString();
  /* 提交到 GitHub */
  var btn = document.getElementById('formSubmitBtn');
  btn.disabled = true;
  btn.textContent = '提交中...';
  try {
    /* 通过 Worker 提交 */
    var res = await fcReq(WORKER_URL + '/customers', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'add', record: record })
    }, getWriteKey());
    if (!res.ok) { var err = await res.json(); throw new Error(err.error || '提交失败'); }
    var result = await res.json();
    /* 更新本地数据 */
    customersData = { records: result.records || [] };
    mergeCustomers();
    renderSidebar();
    showToast('提交成功！客户「' + record.customerName + '」已保存');
    offlineSubmitNotice();
    /* 显示客户表格 */
    setTimeout(function() { showCustomerTable(); }, 800);
  } catch (e) {
    showToast('提交失败：' + e.message);
    btn.disabled = false;
    btn.textContent = '提交客户档案';
  }
}

  document.getElementById('contentWrap').innerHTML = html;
  document.getElementById('contentWrap').scrollTop = 0;

  /* 保存恢复状态（从详情页返回时用），然后清除 */
  var restoreState = (fromMap && customerMapState) ? customerMapState : null;
  if (!fromMap) customerMapState = null;

  /* 初始化地图 */
  loadLeaflet(function() {
    var mapEl = document.getElementById('customerMap');
    if (!mapEl) return;
    mapEl.innerHTML = '';
    var initLat = restoreState ? restoreState.lat : 35.86;
    var initLng = restoreState ? restoreState.lng : 104.19;
    var initZoom = restoreState ? restoreState.zoom : 4;
    customerMap = L.map('customerMap', { center: [initLat, initLng], zoom: initZoom });
    /* 离线底图：中国省级轮廓（放自定义 pane chinaBase zIndex=100，瓦片 tilePane=200、vector overlayPane=400，
       这样联网时高德瓦片盖在底图之上显示清晰街道；离线时瓦片空白才露出底图做兜底） */
    if (window.CHINA_GEO) {
      pomAddChinaBase(customerMap);
    } else {
      loadScript('assets/china-geo.js').then(function() { if (window.CHINA_GEO) pomAddChinaBase(customerMap); }).catch(function() {});
    }
    /* 在线瓦片：高德街道图（联网显示，离线空白自动露出下方中国轮廓） */
    L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
      subdomains: '1234',
      maxZoom: 18,
      errorTileUrl: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==',
      attribution: '&copy; 高德地图'
    }).addTo(customerMap);

    /* 动态聚类：基于像素距离，缩放时自动展开/聚合 */
    var OVERLAP_PX = 26; /* 标记直径20px + 6px间距 */
    var markersLayer = L.layerGroup().addTo(customerMap);

    function renderMarkers() {
      markersLayer.clearLayers();

      /* 将所有客户坐标转为当前缩放级别下的像素坐标 */
      var pts = [];
      for (var i = 0; i < geoList.length; i++) {
        var px = customerMap.latLngToLayerPoint(L.latLng(geoList[i].lat, geoList[i].lng));
        pts.push({ item: geoList[i], x: px.x, y: px.y });
      }

      /* 按像素距离聚类（传递闭包：A重叠B、B重叠C → 同组） */
      var used = new Array(pts.length).fill(false);
      var clusters = [];
      for (var i = 0; i < pts.length; i++) {
        if (used[i]) continue;
        var group = [pts[i]];
        used[i] = true;
        for (var j = 0; j < pts.length; j++) {
          if (used[j]) continue;
          for (var g = 0; g < group.length; g++) {
            var dx = group[g].x - pts[j].x;
            var dy = group[g].y - pts[j].y;
            if (Math.sqrt(dx * dx + dy * dy) <= OVERLAP_PX) {
              group.push(pts[j]);
              used[j] = true;
              break;
            }
          }
        }
        clusters.push(group);
      }

      /* 渲染每个聚类 */
      for (var c = 0; c < clusters.length; c++) {
        (function(cluster) {
          var sumLat = 0, sumLng = 0;
          for (var m = 0; m < cluster.length; m++) { sumLat += cluster[m].item.lat; sumLng += cluster[m].item.lng; }
          var cLat = sumLat / cluster.length;
          var cLng = sumLng / cluster.length;

          if (cluster.length === 1) {
            /* 单个客户：圆形标记，按成交状态着色 */
            var item = cluster[0].item;
            var isDealt = (item.rec.dealStatus || '').indexOf('已成交') >= 0;
            var color = isDealt ? '#10b981' : '#f59e0b';
            var marker = L.circleMarker([item.lat, item.lng], {
              radius: 10, fillColor: color, color: '#fff', weight: 2, opacity: 1, fillOpacity: 0.85
            });
            marker.bindPopup(buildCustPopup(item));
            markersLayer.addLayer(marker);
          } else {
            /* 多个客户重叠：聚合标记，显示数量 */
            var clusterMarker = L.marker([cLat, cLng], {
              icon: L.divIcon({
                className: 'cust-cluster-icon',
                html: '<div class="cust-cluster-badge">' + cluster.length + '</div>',
                iconSize: [36, 36], iconAnchor: [18, 18]
              })
            });

            var popupHtml = '<div style="min-width:220px;max-width:320px;max-height:260px;overflow-y:auto">';
            popupHtml += '<div style="font-weight:600;font-size:13px;color:#6366f1;margin-bottom:8px">📍 此区域有 ' + cluster.length + ' 位客户</div>';
            for (var k = 0; k < cluster.length; k++) {
              (function(it) {
                popupHtml += '<div style="padding:6px 8px;margin-bottom:4px;background:#f8fafc;border-radius:6px;cursor:pointer" onclick="openDetailFromMap(' + it.idx + ')">';
                popupHtml += '<div style="font-weight:600;font-size:13px;color:#1e293b">' + escapeHtml(it.rec.customerName || '') + '</div>';
                popupHtml += '<div style="font-size:11px;color:#64748b">' + escapeHtml((it.rec.dealStatus || '') + ' · ' + (it.rec.customerType || '')) + '</div>';
                popupHtml += '</div>';
              })(cluster[k].item);
            }
            popupHtml += '</div>';
            clusterMarker.bindPopup(popupHtml);
            markersLayer.addLayer(clusterMarker);
          }
        })(clusters[c]);
      }
    }

    /* 初次渲染 + 缩放时重新聚类（先注册监听再 fitBounds，确保不遗漏缩放事件） */
    renderMarkers();
    customerMap.on('zoomend', renderMarkers);

    /* 首次打开自动适配视野；从详情页返回则保持原状态 */
    if (!restoreState && geoList.length > 0) {
      var tmpMarkers = [];
      for (var ti = 0; ti < geoList.length; ti++) {
        tmpMarkers.push(L.marker([geoList[ti].lat, geoList[ti].lng]));
      }
      if (tmpMarkers.length === 1) {
        customerMap.setView([geoList[0].lat, geoList[0].lng], 10);
      } else {
        customerMap.fitBounds(L.featureGroup(tmpMarkers).getBounds(), { padding: [50, 50] });
      }
    }
  });
}

async function saveCustomerEdit() {
  var index = pendingEditIndex;
  if (index < 0) return;
  var cat = kbData.categories['04-客户档案'];
  var records = (cat && cat._customerRecords) || [];
  var rec = records[index];
  if (!rec) { showToast('记录不存在'); return; }
  /* 验证必填项 */
  var nameEl = document.getElementById('field_customerName');
  if (!nameEl || !nameEl.value.trim()) {
    if (nameEl) nameEl.classList.add('error');
    showToast('请填写「拜访客户名称」');
    if (nameEl) nameEl.focus();
    return;
  }
  nameEl.classList.remove('error');
  /* 验证电话格式 */
  var phoneEl = document.getElementById('field_phone');
  if (phoneEl && phoneEl.value.trim()) {
    if (!/^[\d\-\+\s()]{5,20}$/.test(phoneEl.value.trim())) {
      phoneEl.classList.add('error');
      showToast('联系电话格式不正确（5-20位数字，可含-+空格）');
      phoneEl.focus(); return;
    }
    phoneEl.classList.remove('error');
  }
  /* 验证坐标格式 */
  var coordEl = document.getElementById('field_coordinates');
  if (coordEl && coordEl.value.trim()) {
    if (!/^-?\d+(\.\d+)?\s*,\s*-?\d+(\.\d+)?$/.test(coordEl.value.trim())) {
      coordEl.classList.add('error');
      showToast('经纬度格式不正确，应为：纬度,经度（如 22.54,113.75）');
      coordEl.focus(); return;
    }
    coordEl.classList.remove('error');
  }
  /* 收集数据并更新记录（rec 与 customersData.records 中是同一对象引用） */
  for (var s = 0; s < FORM_SECTIONS.length; s++) {
    var fields = FORM_SECTIONS[s].fields;
    for (var f = 0; f < fields.length; f++) {
      var el = document.getElementById('field_' + fields[f].key);
      if (el) rec[fields[f].key] = el.value;
    }
  }
  rec.lastEditTime = new Date().toISOString();
  /* 通过 Worker 更新 */
  var btn = document.getElementById('formSubmitBtn');
  btn.disabled = true;
  btn.textContent = '保存中...';
  try {
    var rawIndex = customersData.records.indexOf(rec);
    var res = await fcReq(WORKER_URL + '/customers', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'update', index: rawIndex, record: rec })
    }, getWriteKey());
    if (!res.ok) { var err = await res.json(); throw new Error(err.error || '保存失败'); }
    var result = await res.json();
    customersData = { records: result.records || [] };
    mergeCustomers();
    renderSidebar();
    showToast('客户「' + (rec.customerName || '') + '」信息已更新');
    offlineSubmitNotice();
    setTimeout(function() { showCustomerTable(); }, 800);
  } catch (e) {
    showToast('保存失败：' + e.message);
    btn.disabled = false;
    btn.textContent = '保存修改';
  }
}

function onHomeSearch(val) {
  if (searchMode !== 'local') return;
  var container = document.getElementById('homeSearchResults');
  if (!container) return;
  val = val.trim();
  if (!val) { container.innerHTML = ''; return; }
  var valLower = val.toLowerCase();
  var results = [];

  /* 优先使用 Fuse.js 全文搜索 */
  if (fuseInstance && val.length >= 2) {
    var fuseResults = fuseInstance.search(val, { limit: 30 });
    for (var i = 0; i < fuseResults.length; i++) {
      var doc = fuseResults[i].item;
      if (isProtected(doc.category) && !unlocked) continue;
      /* 提取匹配摘要 */
      var snippet = '';
      var textLower = doc.text.toLowerCase();
      var idx = textLower.indexOf(valLower);
      if (idx >= 0) {
        var start = Math.max(0, idx - 30);
        var end = Math.min(doc.text.length, idx + val.length + 60);
        snippet = (start > 0 ? '...' : '') + doc.text.slice(start, end) + (end < doc.text.length ? '...' : '');
      } else {
        snippet = doc.text.slice(0, 80) + (doc.text.length > 80 ? '...' : '');
      }
      results.push({ cat: doc.category, catLabel: doc.catLabel, catIcon: doc.catIcon, filename: doc.filename, name: doc.name, subfolder: doc.subfolder, snippet: snippet });
    }
  }

  /* Fuse 无结果时回退到文件名匹配 */
  if (results.length === 0) {
    for (var catKey in kbData.categories) {
      if (isProtected(catKey) && !unlocked) continue;
      var cat = kbData.categories[catKey];
      (cat.files || []).forEach(function(f) {
        if (f.name.toLowerCase().indexOf(valLower) >= 0) results.push({ cat: catKey, catLabel: cat.label, catIcon: cat.icon, filename: f.filename, name: f.name, subfolder: '', snippet: '' });
      });
      (cat.subfolders || []).forEach(function(sub) {
        (sub.files || []).forEach(function(f) {
          if (f.name.toLowerCase().indexOf(valLower) >= 0) results.push({ cat: catKey, catLabel: cat.label, catIcon: cat.icon, filename: f.filename, name: f.name, subfolder: sub.name, snippet: '' });
        });
        (sub.groups || []).forEach(function(g) {
          g.files.forEach(function(f) {
            if (f.name.toLowerCase().indexOf(valLower) >= 0) results.push({ cat: catKey, catLabel: cat.label, catIcon: cat.icon, filename: f.filename, name: f.name, subfolder: sub.name + '/' + g.name, snippet: '' });
          });
        });
      });
    }
  }

  if (results.length === 0) {
    container.innerHTML = '<div class="search-results"><div class="sr-title">未找到匹配的内容</div></div>';
    return;
  }
  var html = '<div class="search-results"><div class="sr-title">找到 ' + results.length + ' 个结果</div>';
  for (var j = 0; j < results.length && j < 20; j++) {
    var r = results[j];
    var sfAttr = r.subfolder ? encodeURIComponent(r.subfolder) : '';
    html += '<div class="sr-item" onclick="openFile(\'' + r.cat + '\',\'' + r.filename + '\',\'' + sfAttr + '\')">'
      + '<span class="sr-icon">' + r.catIcon + '</span>'
      + '<div class="sr-body"><span class="sr-name">' + r.name + '</span>'
      + (r.snippet ? '<div class="sr-snippet">' + r.snippet.replace(/</g, '&lt;') + '</div>' : '')
      + '</div>'
      + '<span class="sr-cat">' + r.catLabel + (r.subfolder ? ' / ' + r.subfolder : '') + '</span>'
      + '</div>';
  }
  html += '</div>';
  container.innerHTML = html;
}

/* ===== 访问统计（静默采集 + GitHub存储） ===== */
var STATS_REPORT_ENABLED = true; // 写侧已迁至阿里云 FC（国内可达），恢复访客上报与 IP 采集
function trackVisit() {
  if (sessionStorage.getItem('pom_visit_tracked')) return;
  sessionStorage.setItem('pom_visit_tracked', '1');
  if (!STATS_REPORT_ENABLED) return; // 写侧不可用，暂停上报（采集/上报逻辑已就绪，迁移后启用）
  var ua = navigator.userAgent;
  var device = 'PC';
  if (/Mobile|Android|iPhone|iPad/i.test(ua)) device = /iPad|Tablet/i.test(ua) ? '平板' : '手机';
  var os = '未知';
  if (/Windows/i.test(ua)) os = 'Windows';
  else if (/Mac OS/i.test(ua)) os = 'macOS';
  else if (/Android/i.test(ua)) os = 'Android';
  else if (/iPhone|iPad/i.test(ua)) os = 'iOS';
  else if (/Linux/i.test(ua)) os = 'Linux';
  var browser = '未知';
  if (/Edg\//i.test(ua)) browser = 'Edge';
  else if (/Chrome\//i.test(ua)) browser = 'Chrome';
  else if (/Firefox\//i.test(ua)) browser = 'Firefox';
  else if (/Safari\//i.test(ua) && !/Chrome/i.test(ua)) browser = 'Safari';
  else if (/MSIE|Trident/i.test(ua)) browser = 'IE';
  var visit = {
    time: new Date().toISOString(),
    device: device, os: os, browser: browser,
    screen: screen.width + 'x' + screen.height,
    lang: navigator.language || '',
    referrer: document.referrer || '直接访问'
  };
  /* 2026-08-01 整改：已移除访客 IP / 归属地采集（JSONP 成功率仅 3%，且涉及隐私），
     直接上报设备维度即可，少一次跨域请求，首屏更快 */
  saveVisit(visit);
}

function saveVisit(visit) {
  if (shouldShowSyncButton()) return; // 离线模式不静默上报访问统计到线上 FC
  fcReq(WORKER_URL + '/stats', {

    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ visit: visit })
  }, STATS_TOKEN).catch(function(e) { console.log('stats save error:', e); });
}
