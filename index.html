var currentStatsDays = 7;
var currentStatsResults = [];
function loadStats(days, realtime) {
  if (shouldShowSyncButton()) {
    var rt0 = document.getElementById('realtimeBtn'); if (rt0) rt0.disabled = true;
    document.querySelectorAll('.range-btn').forEach(function(b){ b.disabled = true; });
    showToast('离线模式暂不支持行情统计，请联网或点同步查看');
    return;
  }
  days = days || currentStatsDays || 7;
  currentStatsDays = days;
  document.querySelectorAll('.range-btn').forEach(function(b){ b.classList.toggle('active', +b.dataset.days === days); });
  var rtBtn = document.getElementById('realtimeBtn');
  var useRealtime = !!realtime;
  var reqDays = days;
  var clamped = false;
  /* 2026-08-01 整改：实时模式改为「近7天走FC + 更早走CDN」混合拉取，任意天数均不再超时，
     故取消原先"超过30天强制截断"的限制，近90天也能完整显示 */
  document.getElementById('statsLoading').style.display = 'block';
  document.getElementById('statsLoading').textContent = useRealtime ? '正在从服务器拉取实时数据...' : '加载统计数据中...';
  document.getElementById('statsData').style.display = 'none';
  if (rtBtn && useRealtime) { rtBtn.disabled = true; rtBtn.textContent = '拉取中...'; }
  // 默认走 jsDelivr CDN（快，最长约12h缓存）；点"拉取实时数据"走阿里云 FC（实时，绕过缓存）
  var loader = useRealtime ? fetchStatsFromFC(reqDays) : fetchStatsFromGitHub(days);
  loader
    .then(function(results) {
      var renderDays = useRealtime ? results.length : days;
      document.getElementById('statsLoading').style.display = 'none';
      document.getElementById('statsData').style.display = 'block';
      currentStatsResults = results;
      renderStatsData(results, renderDays);
      if (rtBtn) {
        rtBtn.disabled = false;
        if (useRealtime) {
          rtBtn.textContent = clamped ? '✅ 实时(近30天)' : '✅ 实时数据';
          setTimeout(function(){ rtBtn.textContent = '🔄 拉取实时数据'; }, 2500);
        } else {
          rtBtn.textContent = '🔄 拉取实时数据';
        }
      }
    })
    .catch(function(e) {
      document.getElementById('statsLoading').style.display = 'none';
      document.getElementById('statsData').style.display = 'block';
      if (rtBtn) { rtBtn.disabled = false; rtBtn.textContent = '🔄 拉取实时数据'; }
      var tip = useRealtime ? '实时接口请求失败，请稍后重试，或直接切换时间范围按钮走 CDN 模式' : '已尝试经 jsDelivr CDN 读取，请检查网络后重试';
      var errMsg = escapeHtml(e.message || '网络错误');
      document.getElementById('statsData').innerHTML = `<div style="text-align:center;padding:40px;color:var(--text-secondary)">加载统计失败：${errMsg}<br><span style="font-size:12px;opacity:.7">${escapeHtml(tip)}</span></div>`;
    });
}

/* 直接读 GitHub 上的 stats/*.json（经 jsDelivr CDN 加速，国内可达），前端按天聚合 */
function fetchStatsFromGitHub(days) {
  var CDN = 'https://cdn.jsdelivr.net/gh/yikezhong1/pom-knowledge-base/stats/';
  var now = new Date();
  var tasks = [];
  for (var i = days - 1; i >= 0; i--) {
    var d = new Date(now); d.setDate(now.getDate() - i);
    var ds = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
    (function(dateStr) {
      tasks.push(
        fetch(CDN + dateStr + '.json?_=' + Date.now())
          .then(function(r) { return r.ok ? r.json() : []; })
          .then(function(arr) { return { date: dateStr, visits: Array.isArray(arr) ? arr : [] }; })
          .catch(function() { return { date: dateStr, visits: [] }; })
      );
    })(ds);
  }
  return Promise.all(tasks);
}

/* ===== 实时读取（2026-08-01 重构，治本修复"近30天/近90天必报502"）=====
   问题根因：阿里云 FC 的 /stats?days=N 按天串行拉 GitHub 上的 stats/YYYY-MM-DD.json，
             耗时随 N 线性增长（实测 7天=4.5s、14天=9.3s、20天起必 502），函数网关约 10s 超时硬截断。
   为何不能简单分批：该接口只接受 days（永远从今天倒推），不支持 date / from-to / offset，
             多批请求会拿回完全相同的数据，拆批无效（已实测四种参数均被忽略）。
   治本方案：混合数据源 —— 只有最近几天的数据会变化，更早的历史数据是静态的。
             · 近 FC_WINDOW 天  → 走 FC 实时接口（绕过 CDN 缓存，保证今天的数据准确）
             · 第 FC_WINDOW 天以前 → 走 jsDelivr CDN（历史数据不再变化，缓存延迟无影响）
             两段并行发出后拼接，任意天数都稳定在 5 秒内返回，永不触发 502。 */
var FC_WINDOW = 7;   // FC 实时窗口天数，实测 7 天约 4.5s，留足超时余量

function fcRange(days) {
  return fcReq(WORKER_URL + '/stats?days=' + days, { cache: 'no-store' })
    .then(function(r) { if (!r.ok) throw new Error('实时接口 HTTP ' + r.status); return r.json(); })
    .then(function(j) {
      var results = (j && j.results) || [];
      /* FC 返回今天在前，reverse 成 旧→新，与 jsDelivr 版保持一致 */
      return results.slice().reverse().map(function(x) {
        return { date: x.date, visits: Array.isArray(x.visits) ? x.visits : [] };
      });
    });
}

/* 取 [days-1 .. skipRecent] 区间的历史数据（相对今天的天数偏移），返回 旧→新 */
function cdnRange(days, skipRecent) {
  var CDN = 'https://cdn.jsdelivr.net/gh/yikezhong1/pom-knowledge-base/stats/';
  var now = new Date();
  var tasks = [];
  for (var i = days - 1; i >= skipRecent; i--) {
    var d = new Date(now); d.setDate(now.getDate() - i);
    var ds = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
    (function(dateStr) {
      tasks.push(
        fetch(CDN + dateStr + '.json')
          .then(function(r) { return r.ok ? r.json() : []; })
          .then(function(arr) { return { date: dateStr, visits: Array.isArray(arr) ? arr : [] }; })
          .catch(function() { return { date: dateStr, visits: [] }; })
      );
    })(ds);
  }
  return Promise.all(tasks);
}

function fetchStatsFromFC(days) {
  if (days <= FC_WINDOW) return fcRange(days);
  /* 历史段(旧) + 实时段(近FC_WINDOW天) 并行拉取后拼接，保持 旧→新 顺序 */
  return Promise.all([cdnRange(days, FC_WINDOW), fcRange(FC_WINDOW)])
    .then(function(parts) { return parts[0].concat(parts[1]); });
}

function renderStatsData(results, days) {
  var allVisits = [], dailyCounts = [];
  results.forEach(function(r) {
    dailyCounts.push({ date: r.date, count: r.visits.length });
    r.visits.forEach(function(v) { v._date = r.date; allVisits.push(v); });
  });
  var totalVisits = allVisits.length;
  /* 2026-08-01 修正：results 为 旧→新 排列，最新一天应取末尾元素（原写成 results[0] 取到的是最早一天） */
  var todayCount = results.length ? results[results.length - 1].visits.length : 0;
  var deviceMap = {}, browserMap = {}, osMap = {};
  allVisits.forEach(function(v) {
    deviceMap[v.device || '未知'] = (deviceMap[v.device || '未知'] || 0) + 1;
    browserMap[v.browser || '未知'] = (browserMap[v.browser || '未知'] || 0) + 1;
    osMap[v.os || '未知'] = (osMap[v.os || '未知'] || 0) + 1;
  });
  var maxCount = Math.max.apply(null, dailyCounts.map(function(d) { return d.count; }).concat([1]));
  var colors = ['#2563eb', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#06b6d4', '#84cc16'];
  var avg = days ? Math.round(totalVisits / days * 10) / 10 : totalVisits;
  var peak = dailyCounts.reduce(function(a, b){ return b.count > a.count ? b : a; }, {date:'-', count:0});
  var h = '';
  /* 汇总卡片 */
  h += '<div class="stats-cards">';
  h += '<div class="stats-card"><div class="num">' + totalVisits + '</div><div class="label">近' + days + '天总访问</div></div>';
  h += '<div class="stats-card"><div class="num">' + todayCount + '</div><div class="label">最新一天访问</div></div>';
  h += '<div class="stats-card"><div class="num">' + avg + '</div><div class="label">日均访问</div></div>';
  h += '<div class="stats-card"><div class="num">' + peak.date.slice(5) + '</div><div class="label">峰值日 ' + peak.count + '次</div></div>';
  h += '</div>';
  /* 每日柱状图 */
  h += '<div class="stats-section"><h3>每日访问量（近' + days + '天）</h3>';
  dailyCounts.slice().reverse().forEach(function(d) {
    var pct = Math.round(d.count / maxCount * 100);
    h += '<div class="stats-bar-row"><span class="stats-bar-label">' + escapeHtml(d.date.slice(5)) + '</span>';
    h += '<div class="stats-bar-track"><div class="stats-bar-fill" style="width:' + Math.max(pct, 2) + '%"></div></div>';
    h += '<span class="stats-bar-val">' + d.count + '</span></div>';
  });
  h += '</div>';
  /* 设备/浏览器/系统/地域分布 */
  function pieSection(title, map, emptyTip) {
    var keys = Object.keys(map);
    var s = '<div class="stats-section"><h3>' + title + '</h3>';
    if (!keys.length) { s += '<div style="color:var(--text-secondary);font-size:13px;padding:8px 0">' + (emptyTip || '暂无数据') + '</div>'; return s + '</div>'; }
    keys.forEach(function(k, i) {
      s += '<div class="stats-pie-row"><span class="stats-pie-dot" style="background:' + colors[i % colors.length] + '"></span>';
      s += '<span class="stats-pie-name">' + escapeHtml(k) + '</span><span class="stats-pie-val">' + map[k] + '次</span></div>';
    });
    return s + '</div>';
  }
  h += pieSection('设备分布', deviceMap);
  h += pieSection('浏览器分布', browserMap);
  h += pieSection('操作系统', osMap);
  /* 2026-08-01 整改：已移除「地域分布」板块（IP 采集功能整体下线） */
  /* 访问明细 */
  h += '<div class="stats-section"><h3>访问明细（最近50条）</h3><div style="overflow-x:auto">';
  h += '<table class="stats-tbl"><thead><tr><th>时间</th><th>设备</th><th>系统</th><th>浏览器</th><th>屏幕</th><th>来源</th></tr></thead><tbody>';
  allVisits.slice(-50).reverse().forEach(function(v) {
    var t = v.time ? escapeHtml(v.time.replace('T', ' ').slice(0, 19)) : '-';
    h += '<tr><td>' + t + '</td>';
    h += '<td>' + (v.device ? escapeHtml(v.device) : '-') + '</td><td>' + (v.os ? escapeHtml(v.os) : '-') + '</td><td>' + (v.browser ? escapeHtml(v.browser) : '-') + '</td>';
    h += '<td>' + (v.screen ? escapeHtml(v.screen) : '-') + '</td>';
    h += '<td style="max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="' + escapeHtml(v.referrer || '') + '">' + (v.referrer ? escapeHtml(v.referrer) : '直接访问') + '</td></tr>';
  });
  h += '</tbody></table></div></div>';
  document.getElementById('statsData').innerHTML = h;
}

function exportStatsCSV() {
  if (!currentStatsResults.length) { handleError('暂无数据可导出', null, 'info'); return; }
  var rows = [['日期','时间','设备','系统','浏览器','屏幕','来源']];
  currentStatsResults.forEach(function(r){
    r.visits.forEach(function(v){
      rows.push([r.date, v.time || '', v.device || '', v.os || '', v.browser || '', v.screen || '', v.referrer || '']);
    });
  });
  var csv = '﻿' + rows.map(function(row){ return row.map(function(c){ return '"' + String(c).replace(/"/g,'""') + '"'; }).join(','); }).join('\r\n');
  var blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '访问统计_' + currentStatsDays + '天_' + new Date().toISOString().slice(0,10) + '.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

/* 统计入口：?stats打开面板，否则静默采集 */
setTimeout(trackVisit, 2000);
if (!shouldShowSyncButton() && location.search.indexOf('stats') >= 0) { openStats(); }

/* ===== Service Worker 缓存 ===== */
/* SW 自愈（2026-08-24 紧急修复）：若浏览器已注册的 SW 版本与当前页面内置版本不一致，
   说明老 SW 还在控制页面、缓存了旧 index.html，会导致首屏永久"加载中"。
   主动注销旧 SW 并重载，确保新版本 SW + 新 index.html 生效。版本号由构建注入，与 sw.js CACHE_NAME 同步。 */
if ('serviceWorker' in navigator) {
  var KB_SW_VERSION = 'pom-kb-202609031406';
  navigator.serviceWorker.getRegistrations().then(function(regs) {
    regs.forEach(function(r) {
      var url = (r.active && r.active.scriptURL) || (r.installing && r.installing.scriptURL) || (r.waiting && r.waiting.scriptURL) || '';
      if (url && KB_SW_VERSION && url.indexOf(KB_SW_VERSION) < 0) {
        r.unregister().then(function() { location.reload(); });
      }
    });
  }).catch(function() {});
  navigator.serviceWorker.register('sw.js?v=' + KB_SW_VERSION, { updateViaCache: 'none' }).catch(function() {});
}
</script>
<!-- 网页截图依赖 html2canvas：改为点击截图按钮时按需懒加载，避免首屏下载 198KB -->
<script>
(function(){
  var b=document.createElement('button');
  b.id='pom-shot-btn';b.innerHTML='📷';b.title='截取整个页面为图片';
  b.style.cssText='position:fixed;right:16px;bottom:16px;z-index:999999;width:50px;height:50px;border-radius:50%;border:none;background:rgba(37,99,235,0.92);color:#fff;font-size:22px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;transition:transform .2s,opacity .2s;line-height:1;padding:0';
  b.onmouseenter=function(){b.style.transform='scale(1.12)'};
  b.onmouseleave=function(){b.style.transform='scale(1)'};
  document.body.appendChild(b);
  b.addEventListener('click',async function(){
    if(b.dataset.busy==='1')return;
    b.dataset.busy='1';b.style.opacity='.4';
    var o=b.innerHTML;b.innerHTML='⏳';b.style.display='none';
    var targets=[document.querySelector('.main'),document.querySelector('.content-wrap')].filter(Boolean);
    var saved=targets.map(function(el){return{el:el,ov:el.style.overflow,h:el.style.height,mh:el.style.maxHeight}});
    targets.forEach(function(el){el.style.overflow='visible';el.style.height='auto';el.style.maxHeight='none'});
    var cw=document.querySelector('.content-wrap');if(cw)cw.scrollTop=0;
    window.scrollTo(0,0);
    if (typeof html2canvas === 'undefined') {
      try { await loadScript('html2canvas.min.js'); }
      catch (e) { handleError('截图组件加载失败', e, 'error'); b.style.display='';b.innerHTML=o;b.style.opacity='';b.dataset.busy='0'; return; }
    }
    var fix=document.createElement('style');fix.id='pom-shot-fix';fix.textContent='*{-webkit-background-clip:border-box!important;-webkit-text-fill-color:initial!important}';document.head.appendChild(fix);
    setTimeout(function(){
      html2canvas(document.querySelector('.content-wrap'),{useCORS:true,scrollY:0,
        backgroundColor:getComputedStyle(document.body).backgroundColor
      }).then(function(c){
        saved.forEach(function(s){s.el.style.overflow=s.ov;s.el.style.height=s.h;s.el.style.maxHeight=s.mh});
        document.head.removeChild(fix);
        var a=document.createElement('a');
        a.download=(document.title||'screenshot').replace(/[\\/:*?"<>|]/g,'_')+'.png';
        a.href=c.toDataURL('image/png');a.click();
      }).catch(function(e){
        saved.forEach(function(s){s.el.style.overflow=s.ov;s.el.style.height=s.h;s.el.style.maxHeight=s.mh});
        document.head.removeChild(fix);
        handleError('截图失败', e, 'error');
      }).then(function(){
        b.style.display='';b.innerHTML=o;b.style.opacity='';b.dataset.busy='0';
      });
    },150);
  });
})();
</script>
